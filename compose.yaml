services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: dbui-postgres
    environment:
      POSTGRES_USER: dbui
      POSTGRES_PASSWORD: dbui
      POSTGRES_DB: dbui
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbui"]
      interval: 5s
      timeout: 3s
      retries: 10
