services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: jdbx-postgres
    environment:
      POSTGRES_USER: jdbx
      POSTGRES_PASSWORD: jdbx
      POSTGRES_DB: jdbx
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdbx"]
      interval: 5s
      timeout: 3s
      retries: 10
