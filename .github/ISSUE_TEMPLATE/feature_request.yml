name: Feature request
description: Suggest an idea or an improvement.
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what is hard? Describe the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected behaviour
      description: How should jdbx behave? Use the terms of GLOSSARY.md if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve the problem that you considered.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I can work on this myself.
